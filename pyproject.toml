[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrid"
version = "0.1.0"
description = "Compound identification from 1H NMR spectra: Random Forest, 1D CNN and Siamese CNN benchmark"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "torch>=2.0",
    "nmrglue>=0.9",
    "rdkit>=2023.3",
    "pyyaml>=6.0",
    "joblib>=1.2",
    "tqdm>=4.64",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["nmrid"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
